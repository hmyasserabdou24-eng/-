<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<svg width="0" height="0" class="sprite" aria-hidden="true">
<symbol id="i-child" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></symbol>
<symbol id="i-report" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-eval" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 10h20M7 15h3M14 15h3"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 5 5L10.5 19"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5zM6.5 22h13.5M9 7h6M9 11h6"/></symbol>
<symbol id="i-contact" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
<symbol id="i-print" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></symbol>

<div id="boot" class="boot" role="status">جارٍ التحميل…</div>

<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" novalidate>
    <img src="logo-sq.png" alt="" class="login-logo">
    <div class="lang-row"><button id="loginLangBtn" class="linkbtn small" type="button">Français</button></div>
    <h1 id="lTitle">فضاء الأولياء</h1>
    <p class="muted" id="lHint">سجّل الدخول لمتابعة ملف طفلك.</p>
    <div id="stCreds">
      <label class="fld"><span id="lblEmail">اسم المستخدم أو البريد الإلكتروني</span><input id="email" type="text" inputmode="email" autocapitalize="none" autocomplete="username" dir="ltr" maxlength="254"></label>
      <label class="fld"><span id="lblPassword">كلمة المرور</span><input id="password" type="password" autocomplete="current-password" dir="ltr" maxlength="72"></label>
    </div>
    <div id="stForgot" hidden>
      <label class="fld"><span id="lblFEmail">البريد الإلكتروني للحساب</span><input id="fEmail" type="email" inputmode="email" autocomplete="username" dir="ltr" maxlength="254"></label>
    </div>
    <div id="stSet" hidden>
      <label class="fld"><span id="lblSetEmail">اسم المستخدم (البريد الإلكتروني)</span><input id="setEmail" type="email" autocomplete="username" dir="ltr" readonly class="fld-readonly"></label>
      <label class="fld"><span id="lblNp1">كلمة المرور الجديدة</span><input id="np1" type="password" autocomplete="new-password" dir="ltr" maxlength="72"><small class="hint" id="npHint">10 أحرف على الأقل مع حرف كبير وصغير ورقم.</small></label>
      <label class="fld"><span id="lblNp2">أعد كتابتها</span><input id="np2" type="password" autocomplete="new-password" dir="ltr" maxlength="72"></label>
    </div>
    <p id="lErr" class="err" role="alert" hidden></p>
    <p id="lOk" class="okmsg" role="status" hidden></p>
    <button id="lBtn" class="btn block" type="submit">دخول</button>
    <button id="forgotBtn" class="linkbtn" type="button">نسيت كلمة المرور؟</button>
    <button id="backBtn" class="linkbtn" type="button" hidden>رجوع لتسجيل الدخول</button>
    <p class="muted small" id="loginNotice">الحسابات تُنشأ من إدارة المركز فقط. إن لم تصلك دعوة فتواصل مع المركز.</p>
  </form>
</main>

<div id="app" hidden>
  <header class="parent-modern-bar">
    <div class="pm-brand">
      <button id="parentMenuBtn" class="pm-menu-btn" type="button" aria-label="القائمة الجانبية" title="القائمة الرئيسية" aria-expanded="false">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <img src="logo-sq.png" alt="شعار دار الإحسان" class="pm-logo">
      <div class="pm-title-block">
        <h1 class="pm-title">دار الإحسان</h1>
        <p class="pm-sub" id="barTitle">فضاء الأولياء</p>
      </div>
    </div>
    <div class="pm-header-actions">
      <span class="pm-kid-chip" id="who">—</span>
      <button id="installHeaderBtn" class="pm-install-header-btn" type="button" aria-label="تثبيت التطبيق على الهاتف" title="تثبيت التطبيق على الهاتف">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="pm-ihb-text">تثبيت التطبيق</span>
      </button>
      <button id="notifBtn" class="pm-notif-btn" type="button" aria-label="الإشعارات والتنبيهات" title="الإشعارات">
        <svg class="i"><use href="#i-bell"/></svg>
        <span id="notifBadge" class="pm-notif-badge" hidden>0</span>
      </button>
      <button id="logoutBtn" class="pm-logout-btn" type="button" aria-label="تسجيل الخروج" title="تسجيل الخروج">
        <svg class="i"><use href="#i-out"/></svg>
      </button>
    </div>
  </header>

  <!-- القائمة الجانبية التي تنزلق من اليمين (Right Slide-in Drawer) -->
  <div id="parentScrim" class="pm-drawer-scrim" aria-hidden="true"></div>
  <aside id="parentDrawer" class="pm-drawer" aria-label="القائمة الجانبية" aria-hidden="true">
    <div class="pm-drawer-header">
      <div class="pm-drawer-brand">
        <img src="logo-sq.png" alt="شعار دار الإحسان" class="pm-drawer-logo">
        <div class="pm-drawer-title-box">
          <h2 class="pm-drawer-title">دار الإحسان</h2>
          <span class="pm-drawer-sub">فضاء الأولياء الرسمي</span>
        </div>
      </div>
      <button id="drawerCloseBtn" class="pm-drawer-close-btn" type="button" aria-label="إغلاق القائمة">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="pm-drawer-child-card" id="drawerChildInfo">
      <div class="pm-dcc-greet">الملف المتابع حالياً:</div>
      <div class="pm-dcc-name" id="drawerChildName">—</div>
      <div class="pm-dcc-badges" id="drawerChildBadges"></div>
    </div>

    <!-- زر تثبيت فضاء الأولياء على الهاتف المحمول -->
    <div class="pm-drawer-install-card">
      <button id="drawerInstallBtn" class="pm-drawer-install-btn" type="button">
        <div class="pm-dib-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12.01" y2="18"/><path d="M12 7v6m-3-3l3 3 3-3"/></svg>
        </div>
        <div class="pm-dib-info">
          <span class="pm-dib-title">تثبيت فضاء الأولياء</span>
          <span class="pm-dib-desc">تنزيل التطبيق على هاتفك المحمول</span>
        </div>
        <span class="pm-dib-badge">تثبيت</span>
      </button>
    </div>

    <div class="pm-drawer-nav-label">الأقسام والخدمات</div>
    <nav class="pm-drawer-nav" id="drawerTabs" role="tablist" aria-label="أقسام فضاء الأولياء"></nav>

    <div class="pm-drawer-footer">
      <button id="drawerLogoutBtn" class="pm-drawer-logout-btn" type="button">
        <svg class="i"><use href="#i-out"/></svg>
        <span>تسجيل الخروج</span>
      </button>
    </div>
  </aside>

  <div class="wrap pm-desktop-wrap">
    <nav class="pm-nav-tabs pm-desktop-tabs" id="tabs" role="tablist" aria-label="الأقسام"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true"><div id="modalCard" class="modal-card"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="icons.js?v=1"></script>
<script src="navback.js?v=26"></script>
<script src="pdf-writer.js?v=1"></script>
<script src="parent.js?v=26"></script>
</body>
