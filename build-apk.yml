name: Build Dar El Ihsan Parents APK

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-Structure Project If Flat
        run: |
          if [ -f "organize_project.py" ]; then
            python3 organize_project.py
          fi

      - name: Setup Firebase google-services.json (if provided as Secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json configured from GitHub Secrets."
          elif [ -f "app/google-services.json.template" ]; then
            cp app/google-services.json.template app/google-services.json
            echo "Used template google-services.json for build."
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate Generated APKs
        id: find_apks
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarElIhsan-Parents-APK
          path: output_apks/*.apk
          retention-days: 30
