name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed only to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PARENT_URL: ${{ vars.PARENT_URL }}            # Settings > Secrets and variables > Actions > Variables
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Firebase config (optional; without it the app builds but notifications stay off)
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON_B64 }}' }
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > app/google-services.json; echo "FCM enabled"; else echo "::warning::GOOGLE_SERVICES_JSON_B64 missing: building WITHOUT notifications"; fi

      - name: Signing key (optional; without it no signed release is produced)
        env: { KS: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK (installable for testing)
        run: gradle :app:assembleDebug --no-daemon

      - name: Build signed release APK
        if: env.KEYSTORE_PATH != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Check the files exist
        run: |
          ls -l app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$KEYSTORE_PATH" ]; then ls -l app/build/outputs/apk/release/app-release.apk; fi

      - uses: actions/upload-artifact@v4
        with:
          name: darelihsan-parents-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
